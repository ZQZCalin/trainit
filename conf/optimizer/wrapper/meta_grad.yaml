name: meta_grad
base_lr: 1e-3
clip_min: 1e-8
clip_max: null
momentum: 0.0
learning_rate:
  schedule_name: constant
  value: 1e-4
regularizer:
  name: log_tanh
  regularization:
    schedule_name: warmup_constant
    value: 1.0
    warmup: 200
    total_steps: 2000
  decay:
    schedule_name: constant
    value: 1.0
aux_output_lr: null